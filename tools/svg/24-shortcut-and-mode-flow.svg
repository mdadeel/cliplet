<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="648" viewBox="0 0 1160 648">
<defs>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="blurBg" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  
    <linearGradient id="glassdark" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#2a2b30" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#212227" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#1b1c20" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="glasslight" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#f4f5f7" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f6fb5"/>
      <stop offset="55%" stop-color="#7a4fb0"/>
      <stop offset="100%" stop-color="#e07a4f"/>
    </linearGradient>
    
</defs>
<rect x="0.0" y="0.0" width="1160.0" height="648.0" rx="0" fill="#131315"/><text x="40.0" y="56.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Shortcuts are the user’s decision — assign, rebind, or switch off</text><text x="40.0" y="82.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12.5" font-weight="400" fill="rgba(255,255,255,0.55)" text-anchor="start">Three rows per module: the accelerator, who owns it, and an off switch. Nothing is forced and nothing is silently stolen.</text><rect x="40.0" y="106.0" width="640.0" height="372.0" rx="12" fill="#28282b" stroke="rgba(255,255,255,0.09)" stroke-width="1"/><text x="60.0" y="140.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Clipboard history</text><rect x="60.0" y="164.0" width="600.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="62.0" y="190.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12.5" font-weight="500" fill="rgba(255,255,255,0.90)" text-anchor="start">Open popup</text><text x="62.0" y="209.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.48)" text-anchor="start">Windows-style preset · replaces GNOME’s notification list binding</text><rect x="545.6" y="178.0" width="94.4" height="30.0" rx="7" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="592.8" y="198.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Super + V</text><path d="M527.2 187.64 L530.28 191.0 L527.2 194.36" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="60.0" y="226.0" width="600.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="62.0" y="252.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12.5" font-weight="500" fill="rgba(255,255,255,0.90)" text-anchor="start">Open popup (alternate)</text><text x="62.0" y="271.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.48)" text-anchor="start">No known conflict</text><rect x="484.8" y="240.0" width="155.2" height="30.0" rx="7" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="562.4" y="260.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Super + Shift + V</text><path d="M466.40000000000003 249.64 L469.48 253.0 L466.40000000000003 256.36" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="60.0" y="288.0" width="600.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="62.0" y="314.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12.5" font-weight="500" fill="rgba(255,255,255,0.90)" text-anchor="start">Module</text><text x="62.0" y="333.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.48)" text-anchor="start">Turn off to remove every clipboard connection</text><rect x="594.0" y="302.0" width="46.0" height="26.0" rx="13" fill="#3584e4"/><circle cx="627.0" cy="315.0" r="11.0" fill="#ffffff"/><rect x="60.0" y="356.0" width="600.0" height="96.0" rx="8" fill="rgba(245,194,17,0.07)" stroke="rgba(245,194,17,0.32)" stroke-width="1"/><text x="76.0" y="382.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12.5" font-weight="600" fill="#f5c211" text-anchor="start">⚠  Super + V is already used by GNOME</text><text x="76.0" y="402.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">“Show the notification list” is bound in org.gnome.shell.keybindings.</text><text x="76.0" y="420.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">Cliplet will take it over. Undo here, or reset it in GNOME Settings › Keyboard.</text><rect x="76.0" y="430.0" width="104.0" height="0.0" rx="0" fill="none"/><rect x="76.0" y="428.0" width="104.0" height="20.0" rx="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/><text x="128.0" y="442.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Use anyway</text><rect x="192.0" y="428.0" width="104.0" height="20.0" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><text x="244.0" y="442.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.72)" text-anchor="middle">Keep Super+Shift+V</text><text x="720.0" y="114.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Three ways to open the same popup</text><rect x="720.0" y="140.0" width="400.0" height="104.0" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="736.0" y="158.0" width="22.0" height="22.0" rx="6" fill="rgba(53,132,228,0.28)"/><text x="747.0" y="174.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="770.0" y="173.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Shortcut, chosen by the user</text><text x="770.0" y="194.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.58)" text-anchor="start">Assign clipboard and emoji accelerators independently.</text><text x="770.0" y="209.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.58)" text-anchor="start">Either can be disabled. Diagnostics at enable() warn</text><text x="770.0" y="224.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.58)" text-anchor="start">about ownership before the key is taken.</text><rect x="720.0" y="256.0" width="400.0" height="104.0" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="736.0" y="274.0" width="22.0" height="22.0" rx="6" fill="rgba(53,132,228,0.28)"/><text x="747.0" y="290.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="770.0" y="289.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">One popup, switched inside it</text><text x="770.0" y="310.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.58)" text-anchor="start">A segmented control in the header moves between</text><text x="770.0" y="325.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.58)" text-anchor="start">Clipboard and Emoji. Tab flips modes; the popup</text><text x="770.0" y="340.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.58)" text-anchor="start">remembers where you were.</text><rect x="720.0" y="372.0" width="400.0" height="104.0" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="736.0" y="390.0" width="22.0" height="22.0" rx="6" fill="rgba(53,132,228,0.28)"/><text x="747.0" y="406.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="770.0" y="405.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Pointer or panel</text><text x="770.0" y="426.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.58)" text-anchor="start">Optional top-bar entry and a click on the caret for</text><text x="770.0" y="441.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.58)" text-anchor="start">people who do not want to learn a chord at all.</text><rect x="40.0" y="508.0" width="1080.0" height="96.0" rx="10" fill="rgba(53,132,228,0.09)" stroke="rgba(53,132,228,0.32)" stroke-width="1"/><text x="60.0" y="536.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">Emoji click inserts at the cursor</text><text x="60.0" y="558.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.68)" text-anchor="start">The chosen emoji is injected into the focused text field, then the popup closes. If insertion is refused or the</text><text x="60.0" y="574.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.68)" text-anchor="start">focus target changed, the glyph is copied instead — Cliplet never types into a window you did not choose.</text><text x="60.0" y="592.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.46)" text-anchor="start">Clipboard rows still paste on Enter. Ctrl+Enter copies without pasting.</text>
</svg>