.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="start">raised surface + accent bar</text><rect x="400.0" y="672.0" width="720.0" height="46.0" rx="6" fill="rgba(255,255,255,0.13)"/><rect x="400.0" y="675.0" width="2.5" height="40.0" rx="1.5" fill="#3584e4"/><rect x="412.0" y="682.0" width="26.0" height="26.0" rx="5" fill="rgba(255,255,255,0.085)"/><path d="M423.25280000000004 691.5056000000001 L420.04960000000005 695.0 L423.25280000000004 698.4944" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M426.7472 691.5056000000001 L429.9504 695.0 L426.7472 698.4944" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="450.0" y="699.8" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start">git rebase -i origin/main --autosquash</text><text x="40.0" y="866.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.42)" text-anchor="start">Keyboard path: Tab moves focus between the search field, the list and the footer actions. Esc always returns focus to the previously focused window.</text>
