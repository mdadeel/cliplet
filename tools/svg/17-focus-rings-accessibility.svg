5,0.80)" text-anchor="start">rgba(0,0,0,0.56)</text><text x="700.0" y="244.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">5.65:1 / 4.9:1</text><text x="980.0" y="244.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">AA — floor</text><rect x="40.0" y="254.0" width="1100.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="56.0" y="278.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">--cliplet-hover</text><text x="300.0" y="278.0" font-family="'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">rgba(255,255,255,0.10)</text><text x="520.0" y="278.0" font-family="'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">rgba(0,0,0,0.055)</text><text x="700.0" y="278.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">1.19:1 (surface only)</text><text x="980.0" y="278.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">non-text</text><rect x="40.0" y="288.0" width="1100.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="56.0" y="312.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">--cliplet-accent</text><text x="300.0" y="312.0" font-family="'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">#3584e4</text><text x="520.0" y="312.0" font-family="'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">#3584e4</text><text x="700.0" y="312.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">4.12:1 vs dark bg / 3.77:1 vs light bg</text><text x="980.0" y="312.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="rgba(255,255,255,0.80)" text-anchor="start">graphics only</text><rect x="40.0" y="322.0" width="1100.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="40.0" y="380.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Why the accent is not used as a text background</text><text x="40.0" y="404.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">White on GNOME blue measures 3.77:1 — below AA for body text. So selection is expressed by a raised surface + 2.5 px accent bar,</text><text x="40.0" y="422.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">and full-bleed accent fills are reserved for non-text controls. This is why Direction A rejects the “blue row” pattern by default.</text><text x="40.0" y="470.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Three row states, deliberately distinct</text><text x="56.0" y="526.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.86)" text-anchor="start">1  Keyboard focus</text><text x="56.0" y="544.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="start">raised surface + 2 px accent ring + accent bar</text><rect x="412.0" y="514.0" width="26.0" height="26.0" rx="5" fill="rgba(255,255,255,0.085)"/><path d="M423.25280000000004 