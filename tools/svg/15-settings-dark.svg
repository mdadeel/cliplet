t-size="12" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">History is stored locally and never leaves this device.</text><text x="264.0" y="162.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.56)" text-anchor="start" letter-spacing="1.1">CLIPBOARD</text><rect x="264.0" y="174.0" width="588.0" height="240.0" rx="10" fill="#28282b" stroke="rgba(255,255,255,0.07)" stroke-width="1"/><text x="280.0" y="205.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start">Capture clipboard history</text><text x="280.0" y="222.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">Watch the clipboard while Cliplet is enabled.</text><rect x="790.0" y="202.0" width="46.0" height="26.0" rx="13" fill="#3584e4"/><circle cx="823.0" cy="215.0" r="11.0" fill="#ffffff"/><rect x="280.0" y="238.0" width="556.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="280.0" y="261.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start">Store images as thumbnails</text><text x="280.0" y="278.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">Originals read on paste only. Max 100 MB cache.</text><rect x="790.0" y="258.0" width="46.0" height="26.0" rx="13" fill="#3584e4"/><circle cx="823.0" cy="271.0" r="11.0" fill="#ffffff"/><rect x="280.0" y="294.0" width="556.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="280.0" y="317.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start">Sensitive content</text><text x="280.0" y="334.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">Skip entries marked by password managers.</text><rect x="790.0" y="314.0" width="46.0" height="26.0" rx="13" fill="#3584e4"/><circle cx="823.0" cy="327.0" r="11.0" fill="#ffffff"/><rect x="280.0" y="350.0" width="556.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="280.0" y="373.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start">History limit</text><text x="280.0" y="390.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">200 items</text><text x="818.0" y="380.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.62)" text-anchor="end">200</text><path d="M832.8 375.12 L835.44 378.0 L832.8 380.88" fill="none" stroke="rgba(255,255,255,0.56)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="264.0" y="442.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.56)" text-anchor="start" letter-spacing="1.1">EMOJI</text><rect x="264.0" y="454.0" width="588.0" height="184.0" rx="10" fill="#28282b" stroke="rgba(255,255,255,0.07)" stroke-width="1"/><text x="280.0" y="485.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start">Emoji module</text><text x="280.0" y="502.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">Independent of clipboard history. No shortcut until you set one.</text><rect x="790.0" y="482.0" width="46.0" height="26.0" rx="13" fill="#3584e4"/><circle cx="823.0" cy="495.0" r="11.0" fill="#ffffff"/><rect x="280.0" y="518.0" width="556.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="280.0" y="541.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start">Default skin tone</text><text x="280.0" y="558.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">Five tones</text><text x="818.0" y="548.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.62)" text-anchor="end">Medium</text><path d="M832.8 543.12 L835.44 546.0 L832.8 548.88" fill="none" stroke="rgba(255,255,255,0.56)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="280.0" y="574.0" width="556.0" height="1.0" rx="0" fill="rgba(255,255,255,0.07)"/><text x="280.0" y="597.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="start">Recent emoji storage</text><text x="280.0" y="614.0" font-family="'DejaVu Sans','Noto Sans',sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.62)" text-anchor="start">Shared with clipboard history storage.</text><rect x="790.0" y="594.0" width="46.0" height="26.0" rx="13" fill="#3584e4"/><circle cx="823.0" cy="607.0" r="11.0" fill="#ffffff"/>
